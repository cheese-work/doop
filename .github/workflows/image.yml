# ci-policy: class=deploy
name: Image

# D1 of the deploy train (CHE-5544, plan CHE-5474 C-2): every merge into cheese/main is tested, built
# and pushed to GHCR, and its candidate manifest is recorded. Build happens here on GitHub runners,
# never on a deploy host. This workflow holds no deploy secret and no C00 runner; D2
# (`cd-deploy.yml`) is the only workflow that deploys, from the manifest recorded here. Consumers
# pull by digest (`ref` in the manifest), not by tag.
on:
  push:
    branches: [cheese/main]
  workflow_dispatch:

# One group per SHA: a group keeps at most one pending run, so a shared group would
# drop the middle of three quick merges. Never cancelled: a half-pushed run would
# leave digest and source SHA unrecorded.
concurrency:
  group: image-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The full existing suite (typecheck, lint, build, sharded tests); no image
  # is built from a SHA that has not passed it.
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    # Forks never hold the right to push to this org's registry.
    if: github.repository == 'cheese-work/doop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The SHA tag is a human convenience; the digest is the identity.
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # The C00 readback compares this label with the SHA it deployed.
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The migration inventory D2's `admit` recomputes from the checked-out candidate (C-6).
      - id: inventory
        run: echo "sha=$(node scripts/migration-inventory.mjs)" >> "$GITHUB_OUTPUT"
      # Via env, never inlined into the script.
      - name: Record the candidate manifest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INVENTORY_SHA: ${{ steps.inventory.outputs.sha }}
          D1_RUN_ID: ${{ github.run_id }}
        run: node scripts/image-evidence.mjs candidate-manifest.json && cat candidate-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-manifest
          path: candidate-manifest.json
          if-no-files-found: error
          # D2 trains read the newest successful manifest; keep them for the age bound plus slack.
          retention-days: 35
