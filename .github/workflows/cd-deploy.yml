# ci-policy: class=deploy
name: CD deploy

# D2 of the deploy train (CHE-5544, plan CHE-5474 C-2, C-3, C-5, C-6): the only workflow that touches C00.
# It deploys a candidate that D1 (`image.yml`) already built and recorded. Nothing builds here.
#
#   resolve (hosted)   enter the run, pick the candidate, read the D1 manifest
#   admit (hosted)     pin: manifest, D1 run, image label and migration inventory all name the candidate
#   deploy (C00)       pre-arm check, ARM the marker, then apply (flock + pre-apply check) and readback (3 healthy
#                      checks in 90 s; records T0: restart count, time)
#   readback-delay     waits 15 min in environment c00-readback-delay (a wait timer); hosted, so no runner is held
#   readback-confirm   `c00.sh confirm` on C00, under the flock: migration quiescence, the confirm check, restart count
#                      unchanged since T0, health, digest; a train run then restores the marker
#   rollback           `c00.sh rollback` on C00, under the flock: migration quiescence, then the rollback check on what
#                      C00 runs at that moment. The candidate rolls back to the retained predecessor by digest and the
#                      predecessor is read back; a predecessor or a newer deploy is left alone; then suspend, and the
#                      job fails
#   evidence           every train, recovery and drill run: deploy-evidence.json (artifact) and the run summary (CHE-5549, C-12)
#   lift (C00)         mode lift only (CHE-10091): the audited lift of the suspension marker; no other job runs
#
# The suspension marker (CHE-5545, plan C-10) is one file on the C00 host, written only by the three C00 jobs,
# with scripts/deploy-marker.mjs: a train run arms it before its first change and only a passing confirm of that
# same run restores it; recovery and drill runs, and a rollback, write `suspended:*` and never `clear:*`. Every
# failure leaves it armed or suspended, which stops the train. Lifting is the `lift` job (mode lift). No GitHub App, token,
# environment or repository variable takes part in it (CHE-9877); a missing or unreadable file reads as suspended.
# The train ships OFF: the repository variable DOOP_DEPLOY_TRAIN is absent or not 'on', so a scheduled run
# ends at `resolve` as a clean skip.
# The lift lives here, not in a file of its own: runner group c00-deploy lists the workflow files that may use the
# C00 runner, and this is the one of doop's that holds C00 jobs. tests/c00RunnerAllowList.test.ts keeps it so.
# Schedule: 23:17, 07:17 and 15:17 UTC = 06:17, 14:17 and 22:17 ICT.
on:
  schedule:
    - cron: '17 23,7,15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: train runs the schedule path; recovery and drill need an allowlisted login; lift writes the audited lift (needs decision_id)
        type: choice
        options:
          - train
          - recovery
          - drill
          - lift
        default: train
      candidate_sha:
        description: Full commit SHA of the candidate (recovery and drill only)
        type: string
        default: ''
      schedule_backup:
        description: Set only by the schedule backup (github-actions[bot])
        type: boolean
        default: false
      fault:
        description: Drill fault to inject (used from slice S6)
        type: string
        default: none
      decision_id:
        description: Lift only. Id of the approved Multica decision (action doop.deploy_lift) that names the marker to lift
        type: string
        default: ''

permissions:
  contents: read

# No workflow-level concurrency: a group keeps one pending run and would drop the middle of three.
# The lock is the group `c00-deploy-doop` on each C00 job below, which is never cancelled.

jobs:
  # Mode lift (CHE-5551, train S3b, plan CHE-5474 C-10.6 and C-10.7; folded in here by CHE-10091): the audited lift. It
  # is the only way from `armed:*` or `suspended:*` back to `clear:*`, and nothing but this job writes a lift.
  #
  # Dispatch only, with the id of a Multica decision (`decision_id`). The dispatcher (and the login that triggered the
  # run) must be in vars.DOOP_LIFT_DISPATCHERS. On the C00 runner, under the host lock, scripts/deploy-lift.mjs refuses
  # unless ALL hold:
  #   - the decision is action type doop.deploy_lift (v1), state approved, approved by vars.DOOP_LIFT_APPROVER_ID
  #     (Cheese), and not withdrawn, rejected, revoked or expired;
  #   - its marker_value param equals the marker that stands now, byte for byte, and its repo param is this repository;
  #   - migration quiescence is proven (C-8.8), /healthz answers 200, and the running digest and revision label read;
  #   - right before the write, still under the lock, the decision and the marker are read again and still hold.
  # Then it writes `clear:<nonce>:<this run id>`, reads it back, and records the lifter, decision, approver, health,
  # digest, revision and ICT times in the run summary and lift-evidence.json. A refusal leaves the marker unchanged and
  # fails the run. No step is a human-typed command.
  #
  # The decision is read from the Multica server over the tailnet with a scoped read-only token (environment
  # doop-lift), so the C00 runner must reach that server. The marker is a file on the C00 host (CHE-9877), so the lift
  # holds no GitHub App, token or repository-variable write; environment doop-lift keeps only the decision read secrets.
  # A dispatch from any branch but the default one is skipped: a branch must not run its own lift script.
  # The train ships OFF and this job does not touch the switch (DOOP_DEPLOY_TRAIN). The train jobs above and the
  # evidence job do not run in this mode.
  lift:
    if: ${{ github.repository == 'cheese-work/doop' && github.event_name == 'workflow_dispatch' && inputs.mode == 'lift' && github.ref == 'refs/heads/cheese/main' }}
    runs-on: [self-hosted, cheese-c00-deploy]
    timeout-minutes: 20
    environment: doop-lift
    permissions:
      contents: read
    # One C00 job at a time, shared with deploy, readback-confirm and rollback; a started lift is never cancelled.
    concurrency:
      group: c00-deploy-doop
      cancel-in-progress: false
    env:
      C00_COMPOSE_DIR: ${{ vars.C00_DOOP_COMPOSE_DIR || '/home/congvc/.local/share/doop' }}
      # Empty: c00.sh finds the compose project's `db` service. Set it to name the live Postgres container.
      C00_PG_CONTAINER: ${{ vars.C00_DOOP_PG_CONTAINER }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # First, before any secret is read: a login outside the allowlist ends the run here.
      - name: Admit the dispatcher
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          DISPATCHERS: ${{ vars.DOOP_LIFT_DISPATCHERS }}
        run: node scripts/deploy-lift.mjs admit
      # C-5: every C00 job removes the compat sandboxes first. A failed sweep fails the run before the lift.
      - name: Sweep the compat sandboxes
        run: bash deploy/cd/c00.sh sweep
      # One step, all under the C00 flock: quiescence, then digest, revision label and health, then the decision and
      # the marker read, decided, read again, and written. Anything missing refuses and leaves the marker as it was.
      - name: Lift on C00
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          LIFTER: ${{ github.triggering_actor }}
          DECISION_ID: ${{ inputs.decision_id }}
          APPROVER_ID: ${{ vars.DOOP_LIFT_APPROVER_ID }}
          MULTICA_SERVER_URL: ${{ secrets.DOOP_LIFT_MULTICA_SERVER_URL }}
          MULTICA_WORKSPACE_ID: ${{ secrets.DOOP_LIFT_MULTICA_WORKSPACE_ID }}
          DECISION_READ_TOKEN: ${{ secrets.DOOP_LIFT_DECISION_READ_TOKEN }}
          # What the app answers on C00 itself; set the variable when the published port is not 4400.
          HEALTHZ_URL: ${{ vars.C00_DOOP_HEALTHZ_URL || 'http://127.0.0.1:4400/healthz' }}
        run: bash deploy/cd/c00.sh lift
      - name: Upload the lift evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: lift-evidence
          path: lift-evidence.json
          if-no-files-found: warn

  resolve:
    if: ${{ github.repository == 'cheese-work/doop' && inputs.mode != 'lift' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      go: ${{ steps.pick.outputs.go || 'false' }}
      mode: ${{ steps.decide.outputs.mode }}
      candidate: ${{ steps.pick.outputs.candidate }}
      run_id: ${{ steps.pick.outputs.run_id }}
      manifest: ${{ steps.manifest.outputs.json }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Via env, never inlined into a script. A refusal fails the job; a skip ends the run green.
      # The switch and the pause come from `vars`: `github.token` cannot be given the Variables permission, so
      # reading them through the REST API failed and every run skipped green (CHE-9181). A variable that is not
      # set reads as an empty string, which the gate treats as absent. The marker is on C00 and is checked there,
      # by the pre-arm check (CHE-9877).
      - id: decide
        env:
          DOOP_DEPLOY_TRAIN: ${{ vars.DOOP_DEPLOY_TRAIN }}
          MAIN_RED_PAUSED: ${{ vars.MAIN_RED_PAUSED }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          ATTEMPT: ${{ github.run_attempt }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SCHEDULE_BACKUP: ${{ inputs.schedule_backup }}
          EXTRA: ${{ vars.C00_DEPLOY_AUTHORIZERS }}
        run: node scripts/deploy-gate.mjs decide
      - id: pick
        if: ${{ steps.decide.outputs.go == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ steps.decide.outputs.mode }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node scripts/deploy-gate.mjs resolve
      # The manifest of the chosen D1 run, passed on as a one-line job output for `admit`.
      - id: manifest
        if: ${{ steps.pick.outputs.go == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          D1_RUN: ${{ steps.pick.outputs.run_id }}
        run: |
          gh run download "$D1_RUN" --repo "$REPO" --name candidate-manifest --dir manifest
          echo "json=$(jq -c . manifest/candidate-manifest.json)" >> "$GITHUB_OUTPUT"

  admit:
    needs: resolve
    if: ${{ needs.resolve.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      go: ${{ steps.admit.outputs.go }}
      digest: ${{ steps.admit.outputs.digest }}
      candidate: ${{ needs.resolve.outputs.candidate }}
      mode: ${{ needs.resolve.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate }}
          persist-credentials: false
      # Recomputed from the checked-out candidate, never read from the manifest (C-6).
      - id: inventory
        run: echo "sha=$(node scripts/migration-inventory.mjs | jq -r .sha256)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ needs.resolve.outputs.mode }}
          CANDIDATE: ${{ needs.resolve.outputs.candidate }}
          RUN_ID: ${{ needs.resolve.outputs.run_id }}
          MANIFEST_JSON: ${{ needs.resolve.outputs.manifest }}
          INVENTORY_SHA: ${{ steps.inventory.outputs.sha }}
        run: |
          printf '%s' "$MANIFEST_JSON" > manifest.json
          MANIFEST=manifest.json node scripts/deploy-gate.mjs admit
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  deploy:
    needs: admit
    if: ${{ needs.admit.outputs.go == 'true' && github.repository == 'cheese-work/doop' }}
    runs-on: [self-hosted, cheese-c00-deploy]
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
    # One C00 job at a time; a started deploy is never cancelled midway.
    concurrency:
      group: c00-deploy-doop
      cancel-in-progress: false
    outputs:
      go: ${{ steps.prearm.outputs.go }}
      predecessor_digest: ${{ steps.prearm.outputs.predecessor_digest }}
      predecessor_sha: ${{ steps.prearm.outputs.predecessor_sha }}
      attempted: ${{ steps.apply.outputs.attempted }}
      marker: ${{ steps.arm.outputs.marker }}
      lock_wait_seconds: ${{ steps.apply.outputs.lock_wait_seconds }}
      # T0 of the readback (C-9): what readback-confirm compares with.
      restart_count: ${{ steps.readback.outputs.restart_count }}
      health: ${{ steps.readback.outputs.health }}
      t0_epoch: ${{ steps.readback.outputs.t0_epoch }}
    env:
      DEPLOY_REF: ${{ format('ghcr.io/{0}@{1}', github.repository, needs.admit.outputs.digest) }}
      DEPLOY_SHA: ${{ needs.admit.outputs.candidate }}
      DEPLOY_MODE: ${{ needs.admit.outputs.mode }}
      C00_COMPOSE_DIR: ${{ vars.C00_DOOP_COMPOSE_DIR || '/home/congvc/.local/share/doop' }}
      # Names the one-shot migrate container and its database sessions (CHE-5474 C-8.8).
      DEPLOY_RUN_ID: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
      # The supervised migration path runs only when the deploy train is switched on; absent or off, c00.sh deploys as before the train (CHE-6526).
      DOOP_DEPLOY_TRAIN: ${{ vars.DOOP_DEPLOY_TRAIN }}
      MAIN_RED_PAUSED: ${{ vars.MAIN_RED_PAUSED }}
      # Empty: c00.sh finds the compose project's `db` service. Set it to name the live Postgres container.
      C00_PG_CONTAINER: ${{ vars.C00_DOOP_PG_CONTAINER }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EXTRA: ${{ vars.C00_DEPLOY_AUTHORIZERS }}
      # This attempt's entry facts, revalidated by pre-arm and pre-apply: a rerun of failed jobs reuses
      # resolve and admit, so their entry check is not repeated.
      EVENT: ${{ github.event_name }}
      ACTOR: ${{ github.actor }}
      TRIGGER: ${{ github.triggering_actor }}
      ATTEMPT: ${{ github.run_attempt }}
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_SCHEDULE_BACKUP: ${{ inputs.schedule_backup }}
    steps:
      # The control scripts (gate, marker, c00.sh and what it sources) come from this workflow's own revision, never from the
      # candidate: a recovery to a pre-change SHA must still run today's gate and the host marker. The candidate is
      # checked out beside it, for inventory and history only.
      - name: Check out the trusted control scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Check out the candidate (history only)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.admit.outputs.candidate }}
          path: candidate
          # Full history: the ancestry and range checks need the running revision, which a depth-1 clone lacks.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The job's `vars.*` (the switch and the pause) are a snapshot GitHub takes at an unpublished moment. The age is
      # counted from the original run's created_at, which precedes every job of the run, so it covers resolve, admit, the
      # queue wait, the runner start and the lock wait. A rerun keeps the original created_at. The gate refuses a pre-arm
      # or pre-apply past 180 s or when this step fails (CHE-9877).
      # If the read fails the epoch stays unset, which train and drill refuse as an unknown age, and
      # recovery (which never reads the switch or the pause) is not blocked by it.
      - name: Read when the run was created
        continue-on-error: true
        env:
          RUN_ID: ${{ github.run_id }}
        run: node control/scripts/deploy-gate.mjs snapshot-epoch
      # Step 1 (C-5): nothing below runs on a skip, and nothing on C00 has changed yet.
      - name: Pre-arm check
        id: prearm
        working-directory: candidate
        run: node ../control/scripts/deploy-gate.mjs recheck "$DEPLOY_MODE" --op pre-arm
      # Step 2 (C-10.2): before any login, pull or start. A train run arms from clear; recovery and drill write
      # suspended over whatever stands. A failed write fails the job here, so nothing below runs and nothing
      # on C00 has changed.
      - name: Arm the marker
        id: arm
        if: ${{ steps.prearm.outputs.go == 'true' }}
        env:
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ needs.admit.outputs.candidate }}
        working-directory: control
        run: |
          if [ "$DEPLOY_MODE" = train ]; then
            node scripts/deploy-marker.mjs arm
          else
            node scripts/deploy-marker.mjs suspend --any --reason "$DEPLOY_MODE"
          fi
      - name: Log in to GHCR
        if: ${{ steps.prearm.outputs.go == 'true' }}
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # Takes the flock and runs the pre-apply check inside it, then pulls and starts.
      - name: Apply
        id: apply
        if: ${{ steps.prearm.outputs.go == 'true' }}
        env:
          MARKER_EXPECT: ${{ steps.arm.outputs.marker }}
        working-directory: candidate
        run: bash ../control/deploy/cd/c00.sh apply
      - name: Read back (digest, SHA, health)
        id: readback
        if: ${{ steps.prearm.outputs.go == 'true' }}
        working-directory: candidate
        run: bash ../control/deploy/cd/c00.sh readback
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  # The 15-minute wait is the environment's wait timer (repository setting, see deploy/cd/README.md). A job that
  # waits on an environment holds no runner, so this one is hosted and does nothing once released.
  readback-delay:
    needs: [admit, deploy]
    if: ${{ needs.deploy.result == 'success' && needs.deploy.outputs.attempted == 'true' && github.repository == 'cheese-work/doop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: c00-readback-delay
    permissions: {}
    steps:
      - name: Delay over
        run: echo "readback delay over; readback-confirm checks the candidate on C00"

  readback-confirm:
    needs: [admit, deploy, readback-delay]
    if: ${{ needs.readback-delay.result == 'success' && needs.deploy.result == 'success' && needs.deploy.outputs.attempted == 'true' && github.repository == 'cheese-work/doop' }}
    runs-on: [self-hosted, cheese-c00-deploy]
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: c00-deploy-doop
      cancel-in-progress: false
    outputs:
      restart_count_confirm: ${{ steps.confirm.outputs.restart_count_confirm }}
      confirmed_epoch: ${{ steps.confirm.outputs.confirmed_epoch }}
    env:
      DEPLOY_REF: ${{ format('ghcr.io/{0}@{1}', github.repository, needs.admit.outputs.digest) }}
      DEPLOY_SHA: ${{ needs.admit.outputs.candidate }}
      DEPLOY_MODE: ${{ needs.admit.outputs.mode }}
      # T0 of the readback in the deploy job: the restart count and the time the delay is measured from.
      RESTART_T0: ${{ needs.deploy.outputs.restart_count }}
      T0_EPOCH: ${{ needs.deploy.outputs.t0_epoch }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EXTRA: ${{ vars.C00_DEPLOY_AUTHORIZERS }}
      # Quiescence reads the live database (C-8.8), so confirm needs what deploy and rollback have: the compose
      # project and, when set, the Postgres container (empty: c00.sh finds the project's `db` service).
      C00_COMPOSE_DIR: ${{ vars.C00_DOOP_COMPOSE_DIR || '/home/congvc/.local/share/doop' }}
      DOOP_DEPLOY_TRAIN: ${{ vars.DOOP_DEPLOY_TRAIN }}
      MAIN_RED_PAUSED: ${{ vars.MAIN_RED_PAUSED }}
      C00_PG_CONTAINER: ${{ vars.C00_DOOP_PG_CONTAINER }}
    steps:
      # The control scripts (gate, marker, c00.sh and what it sources) come from this workflow's own revision, never from the
      # candidate: a recovery to a pre-change SHA must still run today's gate and the host marker. The candidate is
      # checked out beside it, for inventory and history only.
      - name: Check out the trusted control scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Check out the candidate (history only)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.admit.outputs.candidate }}
          path: candidate
          # Full history: the ancestry and range checks need the running revision, which a depth-1 clone lacks.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Everything is decided under the flock: quiescence, the confirm check (this run's marker, the candidate's digest
      # and label), the delay, and that the container did not restart since T0 and is healthy. A failure here leaves
      # the marker armed and starts the rollback job. The marker is read from the C00 file.
      - name: Confirm on C00 (quiescence, marker, restarts, health, digest)
        id: confirm
        env:
          MARKER_EXPECT: ${{ needs.deploy.outputs.marker }}
        working-directory: candidate
        run: bash ../control/deploy/cd/c00.sh confirm
      # Last step, and only after the confirm passed: this run's own armed value becomes a new clear (C-10.2).
      # Recovery and drill never restore; a failed or refused restore leaves the marker armed, which is suspended.
      - name: Restore the marker
        if: ${{ env.DEPLOY_MODE == 'train' }}
        env:
          MARKER_EXPECT: ${{ needs.deploy.outputs.marker }}
        working-directory: control
        run: node scripts/deploy-marker.mjs restore

  rollback:
    needs: [admit, deploy, readback-delay, readback-confirm]
    if: ${{ always() && needs.deploy.outputs.attempted == 'true' && (needs.deploy.result == 'failure' || needs.readback-delay.result == 'failure' || needs.readback-confirm.result == 'failure') && github.repository == 'cheese-work/doop' }}
    runs-on: [self-hosted, cheese-c00-deploy]
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: c00-deploy-doop
      cancel-in-progress: false
    outputs:
      action: ${{ steps.rollback.outputs.action }}
      applied: ${{ steps.rollback.outcome }}
    env:
      DEPLOY_REF: ${{ format('ghcr.io/{0}@{1}', github.repository, needs.admit.outputs.digest) }}
      DEPLOY_SHA: ${{ needs.admit.outputs.candidate }}
      DEPLOY_MODE: ${{ needs.admit.outputs.mode }}
      PREDECESSOR_DIGEST: ${{ needs.deploy.outputs.predecessor_digest }}
      PREDECESSOR_SHA: ${{ needs.deploy.outputs.predecessor_sha }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EXTRA: ${{ vars.C00_DEPLOY_AUTHORIZERS }}
      C00_COMPOSE_DIR: ${{ vars.C00_DOOP_COMPOSE_DIR || '/home/congvc/.local/share/doop' }}
      # The supervised migration path runs only when the deploy train is switched on; absent or off, c00.sh deploys as before the train (CHE-6526).
      DOOP_DEPLOY_TRAIN: ${{ vars.DOOP_DEPLOY_TRAIN }}
      MAIN_RED_PAUSED: ${{ vars.MAIN_RED_PAUSED }}
      # Empty: c00.sh finds the compose project's `db` service. Set it to name the live Postgres container.
      C00_PG_CONTAINER: ${{ vars.C00_DOOP_PG_CONTAINER }}
    steps:
      # The control scripts (gate, marker, c00.sh and what it sources) come from this workflow's own revision, never from the
      # candidate: a recovery to a pre-change SHA must still run today's gate and the host marker. The candidate is
      # checked out beside it, for inventory and history only.
      - name: Check out the trusted control scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Check out the candidate (history only)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.admit.outputs.candidate }}
          path: candidate
          # Full history: the ancestry and range checks need the running revision, which a depth-1 clone lacks.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # One step, all under the C00 flock: migration quiescence, then the rollback check on what C00 runs and what the
      # marker says at that moment. Only a candidate that is still running rolls back; the predecessor already running
      # (`none`) or a newer deploy (`superseded`) changes nothing. A decision made before the lock could replace a
      # newer deployment, so none is made here.
      - name: Roll back by digest
        id: rollback
        if: ${{ !cancelled() }}
        env:
          MARKER_EXPECT: ${{ needs.deploy.outputs.marker }}
        working-directory: candidate
        run: bash ../control/deploy/cd/c00.sh rollback
      # Whatever the rollback did, even if it failed: this run's armed value becomes suspended (C-10.3). Only a
      # lift (the `lift` job) clears it. Not after a refused check, where the marker is no longer this run's own.
      - name: Suspend the marker
        if: ${{ !cancelled() && steps.rollback.outputs.go == 'true' }}
        env:
          MARKER_EXPECT: ${{ needs.deploy.outputs.marker }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ needs.admit.outputs.candidate }}
          ACTION: ${{ steps.rollback.outputs.action }}
        working-directory: control
        run: node scripts/deploy-marker.mjs suspend --reason "rollback-$ACTION"
      # The run ends red whatever the rollback did: a readback or confirm failure is a failed deploy (C-9).
      - name: Fail the run
        if: ${{ !cancelled() }}
        env:
          ACTION: ${{ steps.rollback.outputs.action }}
        run: |
          echo "deploy failed after the change started; rollback action: ${ACTION:-none (check refused)}; the marker is suspended or armed"
          exit 1

  # Every train, recovery and drill run, whatever happened above: deploy-evidence.json and the run summary (C-12). Hosted, read only.
  evidence:
    needs: [resolve, admit, deploy, readback-delay, readback-confirm, rollback]
    if: ${{ always() && github.repository == 'cheese-work/doop' && inputs.mode != 'lift' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Write the evidence
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          MODE: ${{ needs.resolve.outputs.mode }}
          CANDIDATE: ${{ needs.admit.outputs.candidate }}
          DIGEST: ${{ needs.admit.outputs.digest }}
          PREDECESSOR_SHA: ${{ needs.deploy.outputs.predecessor_sha }}
          PREDECESSOR_DIGEST: ${{ needs.deploy.outputs.predecessor_digest }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          ADMIT_RESULT: ${{ needs.admit.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DELAY_RESULT: ${{ needs.readback-delay.result }}
          CONFIRM_RESULT: ${{ needs.readback-confirm.result }}
          ROLLBACK_RESULT: ${{ needs.rollback.result }}
          ROLLBACK_ACTION: ${{ needs.rollback.outputs.action }}
          ROLLBACK_APPLIED: ${{ needs.rollback.outputs.applied }}
          HEALTH: ${{ needs.deploy.outputs.health }}
          RESTART_COUNT: ${{ needs.deploy.outputs.restart_count }}
          RESTART_COUNT_CONFIRM: ${{ needs.readback-confirm.outputs.restart_count_confirm }}
          T0_EPOCH: ${{ needs.deploy.outputs.t0_epoch }}
          CONFIRMED_EPOCH: ${{ needs.readback-confirm.outputs.confirmed_epoch }}
          LOCK_WAIT_SECONDS: ${{ needs.deploy.outputs.lock_wait_seconds }}
        run: node scripts/deploy-evidence.mjs deploy-evidence.json
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: deploy-evidence
          path: deploy-evidence.json
          if-no-files-found: error
      # After the artifact, so a failed record never loses it: a confirmed deploy is also recorded as a GitHub
      # deployment. That is the durable last successful D2 SHA the watchers (CHE-5550, C-7) read; neither artifact
      # expiry nor a run of skipped slots can lose it.
      - name: Record a confirmed deploy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node scripts/cd-watch.mjs record deploy-evidence.json
