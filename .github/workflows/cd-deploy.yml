# ci-policy: class=deploy
name: CD deploy

# D2 of the deploy train (CHE-5544, plan CHE-5474 C-2, C-3, C-5, C-6): the only workflow that touches C00.
# It deploys a candidate that D1 (`image.yml`) already built and recorded. Nothing builds here.
#
#   resolve (hosted)   enter the run, pick the candidate, read the D1 manifest
#   admit (hosted)     pin: manifest, D1 run, image label and migration inventory all name the candidate
#   deploy (C00)       pre-arm check, ARM the marker, then apply (flock + pre-apply check) and readback
#   readback-confirm   confirm check on C00 that the candidate is what runs; a train run then restores the marker
#   rollback           rollback check, roll back by digest only if C00 still runs the candidate, then suspend
#
# The suspension marker (repo variable DOOP_DEPLOY_SUSPENDED, CHE-5545, plan C-10) is written only by the three
# C00 jobs, with scripts/deploy-marker.mjs: a train run arms it before its first change and only a passing
# confirm of that same run restores it; recovery and drill runs, and a rollback, write `suspended:*` and never
# `clear:*`. Every failure leaves it armed or suspended, which stops the train. Lifting is S3b.
# The train ships OFF: the repository variable DOOP_DEPLOY_TRAIN is absent or not 'on', so a scheduled run
# ends at `resolve` as a clean skip.
# Schedule: 23:17, 07:17 and 15:17 UTC = 06:17, 14:17 and 22:17 ICT.
on:
  schedule:
    - cron: '17 23,7,15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: train runs the schedule path; recovery and drill need an allowlisted login
        type: choice
        options:
          - train
          - recovery
          - drill
        default: train
      candidate_sha:
        description: Full commit SHA of the candidate (recovery and drill only)
        type: string
        default: ''
      schedule_backup:
        description: Set only by the schedule backup (github-actions[bot])
        type: boolean
        default: false
      fault:
        description: Drill fault to inject (used from slice S6)
        type: string
        default: none

permissions:
  contents: read

# No workflow-level concurrency: a group keeps one pending run and would drop the middle of three.
# The lock is the group `c00-deploy-doop` on each C00 job below, which is never cancelled.

jobs:
  resolve:
    if: github.repository == 'cheese-work/doop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      go: ${{ steps.pick.outputs.go || 'false' }}
      mode: ${{ steps.decide.outputs.mode }}
      candidate: ${{ steps.pick.outputs.candidate }}
      run_id: ${{ steps.pick.outputs.run_id }}
      manifest: ${{ steps.manifest.outputs.json }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Via env, never inlined into a script. A refusal fails the job; a skip ends the run green.
      # The switch, the pause and the marker come from `vars`: `github.token` cannot be given the Variables
      # permission, so reading them through the REST API failed and every run skipped green (CHE-9181). A
      # variable that is not set reads as an empty string, which the gate treats as absent.
      - id: decide
        env:
          DOOP_DEPLOY_TRAIN: ${{ vars.DOOP_DEPLOY_TRAIN }}
          MAIN_RED_PAUSED: ${{ vars.MAIN_RED_PAUSED }}
          DOOP_DEPLOY_SUSPENDED: ${{ vars.DOOP_DEPLOY_SUSPENDED }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          ATTEMPT: ${{ github.run_attempt }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SCHEDULE_BACKUP: ${{ inputs.schedule_backup }}
          EXTRA: ${{ vars.C00_DEPLOY_AUTHORIZERS }}
        run: node scripts/deploy-gate.mjs decide
      - id: pick
        if: ${{ steps.decide.outputs.go == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ steps.decide.outputs.mode }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node scripts/deploy-gate.mjs resolve
      # The manifest of the chosen D1 run, passed on as a one-line job output for `admit`.
      - id: manifest
        if: ${{ steps.pick.outputs.go == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          D1_RUN: ${{ steps.pick.outputs.run_id }}
        run: |
          gh run download "$D1_RUN" --repo "$REPO" --name candidate-manifest --dir manifest
          echo "json=$(jq -c . manifest/candidate-manifest.json)" >> "$GITHUB_OUTPUT"

  admit:
    needs: resolve
    if: ${{ needs.resolve.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: read
    outputs:
      go: ${{ steps.admit.outputs.go }}
      digest: ${{ steps.admit.outputs.digest }}
      candidate: ${{ needs.resolve.outputs.candidate }}
      mode: ${{ needs.resolve.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.candidate }}
          persist-credentials: false
      # Recomputed from the checked-out candidate, never read from the manifest (C-6).
      - id: inventory
        run: echo "sha=$(node scripts/migration-inventory.mjs | jq -r .sha256)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - id: admit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ needs.resolve.outputs.mode }}
          CANDIDATE: ${{ needs.resolve.outputs.candidate }}
          RUN_ID: ${{ needs.resolve.outputs.run_id }}
          MANIFEST_JSON: ${{ needs.resolve.outputs.manifest }}
          INVENTORY_SHA: ${{ steps.inventory.outputs.sha }}
        run: |
          printf '%s' "$MANIFEST_JSON" > manifest.json
          MANIFEST=manifest.json node scripts/deploy-gate.mjs admit
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  deploy:
    needs: admit
    if: ${{ needs.admit.outputs.go == 'true' && github.repository == 'cheese-work/doop' }}
    runs-on: [self-hosted, cheese-c00-deploy]
    timeout-minutes: 30
    environment: doop-deploy-marker
    permissions:
      contents: read
      packages: read
    # One C00 job at a time; a started deploy is never cancelled midway.
    concurrency:
      group: c00-deploy-doop
      cancel-in-progress: false
    outputs:
      go: ${{ steps.prearm.outputs.go }}
      predecessor_digest: ${{ steps.prearm.outputs.predecessor_digest }}
      attempted: ${{ steps.apply.outputs.attempted }}
      marker: ${{ steps.arm.outputs.marker }}
    env:
      DEPLOY_REF: ${{ format('ghcr.io/{0}@{1}', github.repository, needs.admit.outputs.digest) }}
      DEPLOY_SHA: ${{ needs.admit.outputs.candidate }}
      DEPLOY_MODE: ${{ needs.admit.outputs.mode }}
      C00_COMPOSE_DIR: ${{ vars.C00_DOOP_COMPOSE_DIR || '/home/congvc/.local/share/doop' }}
      # Names the one-shot migrate container and its database sessions (CHE-5474 C-8.8).
      DEPLOY_RUN_ID: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
      # The supervised migration path runs only when the deploy train is switched on; absent or off, c00.sh deploys as before the train (CHE-6526).
      DOOP_DEPLOY_TRAIN: ${{ vars.DOOP_DEPLOY_TRAIN }}
      # Empty: c00.sh finds the compose project's `db` service. Set it to name the live Postgres container.
      C00_PG_CONTAINER: ${{ vars.C00_DOOP_PG_CONTAINER }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EXTRA: ${{ vars.C00_DEPLOY_AUTHORIZERS }}
      # This attempt's entry facts, revalidated by pre-arm and pre-apply: a rerun of failed jobs reuses
      # resolve and admit, so their entry check is not repeated.
      EVENT: ${{ github.event_name }}
      ACTOR: ${{ github.actor }}
      TRIGGER: ${{ github.triggering_actor }}
      ATTEMPT: ${{ github.run_attempt }}
      INPUT_MODE: ${{ inputs.mode }}
      INPUT_SCHEDULE_BACKUP: ${{ inputs.schedule_backup }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.admit.outputs.candidate }}
          # Full history: the ancestry and range checks need the running revision, which a depth-1 clone lacks.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The marker is a repository variable; `github.token` cannot read or write one, so a GitHub App token does.
      # It is minted in the environment that holds the App key, only for variables, and before the first check
      # that reads a variable (CHE-9181).
      - name: Mint the marker token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DOOP_MARKER_APP_ID }}
          private-key: ${{ secrets.DOOP_MARKER_APP_KEY }}
          repositories: doop
          permission-variables: write
      # Step 1 (C-5): nothing below runs on a skip, and nothing on C00 has changed yet.
      - name: Pre-arm check
        id: prearm
        env:
          VARS_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/deploy-gate.mjs recheck "$DEPLOY_MODE" --op pre-arm
      # Step 2 (C-10.2): before any login, pull or start. A train run arms from clear; recovery and drill write
      # suspended over whatever stands. A failed write fails the job here, so nothing below runs and nothing
      # on C00 has changed.
      - name: Arm the marker
        id: arm
        if: ${{ steps.prearm.outputs.go == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ needs.admit.outputs.candidate }}
        run: |
          if [ "$DEPLOY_MODE" = train ]; then
            node scripts/deploy-marker.mjs arm
          else
            node scripts/deploy-marker.mjs suspend --any --reason "$DEPLOY_MODE"
          fi
      - name: Log in to GHCR
        if: ${{ steps.prearm.outputs.go == 'true' }}
        env:
          TOKEN: ${{ github.token }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # Takes the flock and runs the pre-apply check inside it, then pulls and starts.
      - name: Apply
        id: apply
        if: ${{ steps.prearm.outputs.go == 'true' }}
        env:
          MARKER_EXPECT: ${{ steps.arm.outputs.marker }}
          VARS_TOKEN: ${{ steps.app.outputs.token }}
        run: bash deploy/cd/c00.sh apply
      - name: Read back (digest, SHA, health)
        if: ${{ steps.prearm.outputs.go == 'true' }}
        run: bash deploy/cd/c00.sh readback
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  readback-confirm:
    needs: [admit, deploy]
    if: ${{ needs.deploy.result == 'success' && needs.deploy.outputs.attempted == 'true' && github.repository == 'cheese-work/doop' }}
    runs-on: [self-hosted, cheese-c00-deploy]
    timeout-minutes: 20
    environment: doop-deploy-marker
    permissions:
      contents: read
    concurrency:
      group: c00-deploy-doop
      cancel-in-progress: false
    env:
      DEPLOY_REF: ${{ format('ghcr.io/{0}@{1}', github.repository, needs.admit.outputs.digest) }}
      DEPLOY_SHA: ${{ needs.admit.outputs.candidate }}
      DEPLOY_MODE: ${{ needs.admit.outputs.mode }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EXTRA: ${{ vars.C00_DEPLOY_AUTHORIZERS }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.admit.outputs.candidate }}
          # Full history: the ancestry and range checks need the running revision, which a depth-1 clone lacks.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The marker is a repository variable; `github.token` cannot read or write one, so a GitHub App token does.
      # It is minted in the environment that holds the App key, only for variables, and before the first check
      # that reads a variable (CHE-9181).
      - name: Mint the marker token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DOOP_MARKER_APP_ID }}
          private-key: ${{ secrets.DOOP_MARKER_APP_KEY }}
          repositories: doop
          permission-variables: write
      - name: Confirm check
        env:
          MARKER_EXPECT: ${{ needs.deploy.outputs.marker }}
          VARS_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/deploy-gate.mjs recheck "$DEPLOY_MODE" --op confirm --expect "$MARKER_EXPECT"
      # Last step, and only after the confirm passed: this run's own armed value becomes a new clear (C-10.2).
      # Recovery and drill never restore; a failed or refused restore leaves the marker armed, which is suspended.
      - name: Restore the marker
        if: ${{ env.DEPLOY_MODE == 'train' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MARKER_EXPECT: ${{ needs.deploy.outputs.marker }}
        run: node scripts/deploy-marker.mjs restore

  rollback:
    needs: [admit, deploy, readback-confirm]
    if: ${{ always() && needs.deploy.outputs.attempted == 'true' && (needs.deploy.result == 'failure' || needs.readback-confirm.result == 'failure') && github.repository == 'cheese-work/doop' }}
    runs-on: [self-hosted, cheese-c00-deploy]
    timeout-minutes: 20
    environment: doop-deploy-marker
    permissions:
      contents: read
    concurrency:
      group: c00-deploy-doop
      cancel-in-progress: false
    env:
      DEPLOY_REF: ${{ format('ghcr.io/{0}@{1}', github.repository, needs.admit.outputs.digest) }}
      DEPLOY_SHA: ${{ needs.admit.outputs.candidate }}
      DEPLOY_MODE: ${{ needs.admit.outputs.mode }}
      PREDECESSOR_DIGEST: ${{ needs.deploy.outputs.predecessor_digest }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      EXTRA: ${{ vars.C00_DEPLOY_AUTHORIZERS }}
      C00_COMPOSE_DIR: ${{ vars.C00_DOOP_COMPOSE_DIR || '/home/congvc/.local/share/doop' }}
      # The supervised migration path runs only when the deploy train is switched on; absent or off, c00.sh deploys as before the train (CHE-6526).
      DOOP_DEPLOY_TRAIN: ${{ vars.DOOP_DEPLOY_TRAIN }}
      # Empty: c00.sh finds the compose project's `db` service. Set it to name the live Postgres container.
      C00_PG_CONTAINER: ${{ vars.C00_DOOP_PG_CONTAINER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.admit.outputs.candidate }}
          # Full history: the ancestry and range checks need the running revision, which a depth-1 clone lacks.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The marker is a repository variable; `github.token` cannot write one, so a GitHub App token does.
      # It is minted in the environment that holds the App key, only for variables, and just before its first use.
      # Minted before the rollback check, which reads the marker to prove it is still this run's own (CHE-9181),
      # but the next two steps run after a failed mint (!cancelled()): it fails the job, it never keeps a broken
      # deploy from rolling back. Without a token the check decides from what C00 runs alone, and the suspend
      # step below then fails loudly.
      - name: Mint the marker token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DOOP_MARKER_APP_ID }}
          private-key: ${{ secrets.DOOP_MARKER_APP_KEY }}
          repositories: doop
          permission-variables: write
      # Acts on what C00 runs: the candidate rolls back; the predecessor or a newer deploy is left alone.
      - name: Rollback check
        id: check
        if: ${{ !cancelled() }}
        env:
          MARKER_EXPECT: ${{ needs.deploy.outputs.marker }}
          VARS_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/deploy-gate.mjs recheck "$DEPLOY_MODE" --op rollback --expect "$MARKER_EXPECT"
      - name: Roll back by digest
        if: ${{ !cancelled() && steps.check.outputs.action == 'rollback' }}
        run: bash deploy/cd/c00.sh rollback
      # Whatever the rollback did, even if it failed: this run's armed value becomes suspended (C-10.3). Only a
      # lift (S3b) clears it. Not after a refused check, where the marker is no longer this run's own.
      - name: Suspend the marker
        if: ${{ !cancelled() && steps.check.outputs.go == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MARKER_EXPECT: ${{ needs.deploy.outputs.marker }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ needs.admit.outputs.candidate }}
          ACTION: ${{ steps.check.outputs.action }}
        run: node scripts/deploy-marker.mjs suspend --reason "rollback-$ACTION"
