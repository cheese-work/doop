# ci-policy: class=pr-validation
name: CI

on:
  push:
    branches: [cheese/main]
  pull_request:
    # `edited` fires on a title, body or base change: the title lint and the Changelog line guard read the
    # live PR text, so an edit must re-run them (a stale green check would outlive it). The other three are
    # GitHub's default set, listed because naming `types` replaces it.
    types: [opened, synchronize, reopened, edited]
  # image.yml gates the image build on this exact suite rather than copying it
  workflow_call:

# A new push to the same PR supersedes the run in flight; main is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PRs land on main as a squash, so the PR *title* becomes the commit subject —
  # that, not the branch's commits, is what has to satisfy commitlint. The local
  # commit-msg hook can't see it, so this is the only place it gets checked.
  commit-message:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Via env, never inlined into the script: a PR title is attacker-controlled text.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx --bun commitlint
      # CHE-10491: a feat/fix/perf PR to cheese/main carries a valid Changelog line. The checker comes from
      # the PR's base SHA and the head is read only as data (title, body, changed paths). The one exception is
      # a PR whose base has no checker yet: it runs its own copy and says so in the job summary.
      # Via env, never inlined into the script: the PR body and title are attacker-controlled text.
      - name: Changelog line
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/changelog-line"
          mkdir -p "$work"
          # Live title, body and base: a re-run sees an edited body, which the event payload would not carry.
          gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '{title, body, baseRef: .base.ref}' > "$work/pr.json"
          # A rename counts at both ends, so moving a file out of a user-facing path still shows.
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$work/files.txt"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git cat-file -e "$BASE_SHA:scripts/changelog-line.mjs" 2>/dev/null; then
            git show "$BASE_SHA:scripts/changelog-line.mjs" > "$work/changelog-line.mjs"
            echo "Checker: scripts/changelog-line.mjs from the base $BASE_SHA." >> "$GITHUB_STEP_SUMMARY"
          else
            cp scripts/changelog-line.mjs "$work/changelog-line.mjs"
            echo "Checker: this PR's own copy of scripts/changelog-line.mjs, because the base $BASE_SHA has no checker yet." >> "$GITHUB_STEP_SUMMARY"
          fi
          node "$work/changelog-line.mjs" --pr "$work/pr.json" --files "$work/files.txt"

  # The checks run as parallel jobs so wall-clock is the slowest one, not the
  # sum. Install is ~5s per job (setup-bun restores ~/.bun/install/cache keyed
  # on bun.lock), so the duplication is cheap.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run doc-lint
      # CHE-7207 S2a then S2. The base step fetches its base commit and writes MIGRATION_BASE_SHA to
      # $GITHUB_ENV; the ledger check fails closed without it. Information until CHE-5543's ruleset lists `lint`.
      - name: Select the migration base
        run: node scripts/ci/migration-base.mjs
      - name: Migration ledger check
        run: node scripts/migration-ledger-check.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The Docker build stage uses Bun even for commands named `node`.
      - run: bun run --bun build

  # The suite boots a real server per integration file, which is CPU-bound on
  # the 2-vCPU runner; sharding across runners is what brings the step down.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      # First in every shard: picks the migration base and exports MIGRATION_* for
      # tests/migrationReplay.test.ts, which replays base -> head (CHE-7207 S3b)
      - name: Select the migration base
        run: node scripts/ci/migration-base.mjs
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The browser tests drive the Chrome named in .chrome-version, not the one
      # the runner image happens to ship: an image update must not be able to
      # change what the suite runs on without a commit here.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/doop-chrome
          key: chrome-${{ runner.os }}-${{ hashFiles('.chrome-version') }}
      - name: Install the pinned Chrome
        run: |
          ./node_modules/.bin/browsers install "chrome@$(cat .chrome-version)" --path ~/.cache/doop-chrome > "$RUNNER_TEMP/chrome-install"
          path=$(awk '{ print $2 }' "$RUNNER_TEMP/chrome-install")
          "$path" --version
          echo "CHROME_PATH=$path" >> "$GITHUB_ENV"
          # Ubuntu 24.04 lets only the browsers it has an AppArmor profile for
          # make the user namespaces Chrome's sandbox needs
          echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns >/dev/null
      # `bun run test`, not `bun test`: the suite is vitest, and `bun test`
      # would run Bun's own runner against the same files
      - run: bun run test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # One status that stands for every shard, so a required check or a merge
  # queue names "tests" rather than each "test (N)"; renumbering the matrix
  # never silently drops a protection.
  tests:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success
