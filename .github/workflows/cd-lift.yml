# ci-policy: class=deploy
name: CD lift

# S3b of the deploy train (CHE-5551, plan CHE-5474 C-10.6 and C-10.7): the audited lift. It is the only way from
# `armed:*` or `suspended:*` back to `clear:*`, and nothing but this workflow writes a lift.
#
# Dispatch only, one input: the id of a Multica decision. The dispatcher (and the login that triggered the run)
# must be in vars.DOOP_LIFT_DISPATCHERS. On the C00 runner, under the host lock, scripts/deploy-lift.mjs refuses
# unless ALL hold:
#   - the decision is action type doop.deploy_lift (v1), state approved, approved by vars.DOOP_LIFT_APPROVER_ID
#     (Cheese), and not withdrawn, rejected, revoked or expired;
#   - its marker_value param equals the marker that stands now, byte for byte, and its repo param is this repository;
#   - migration quiescence is proven (C-8.8), /healthz answers 200, and the running digest and revision label read;
#   - right before the write, still under the lock, the decision and the marker are read again and still hold.
# Then it writes `clear:<nonce>:<this run id>`, reads it back, and records the lifter, decision, approver, health,
# digest, revision and ICT times in the run summary and lift-evidence.json. A refusal leaves the marker unchanged and
# fails the run. No step is a human-typed command.
#
# The decision is read from the Multica server over the tailnet with a scoped read-only token (environment
# doop-lift), so the C00 runner must reach that server. The marker is a file on the C00 host (CHE-9877), so the lift
# holds no GitHub App, token or repository-variable write; environment doop-lift keeps only the decision read secrets.
# A dispatch from any branch but the default one is skipped: a branch must not run its own lift script.
# The train ships OFF and this workflow does not touch the switch (DOOP_DEPLOY_TRAIN).
on:
  workflow_dispatch:
    inputs:
      decision_id:
        description: Id of the approved Multica decision (action doop.deploy_lift) that names the marker to lift
        type: string
        required: true

permissions:
  contents: read

jobs:
  lift:
    if: ${{ github.repository == 'cheese-work/doop' && github.ref == 'refs/heads/cheese/main' }}
    runs-on: [self-hosted, cheese-c00-deploy]
    timeout-minutes: 20
    environment: doop-lift
    permissions:
      contents: read
    # One C00 job at a time, shared with deploy, readback-confirm and rollback; a started lift is never cancelled.
    concurrency:
      group: c00-deploy-doop
      cancel-in-progress: false
    env:
      C00_COMPOSE_DIR: ${{ vars.C00_DOOP_COMPOSE_DIR || '/home/congvc/.local/share/doop' }}
      # Empty: c00.sh finds the compose project's `db` service. Set it to name the live Postgres container.
      C00_PG_CONTAINER: ${{ vars.C00_DOOP_PG_CONTAINER }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # First, before any secret is read: a login outside the allowlist ends the run here.
      - name: Admit the dispatcher
        env:
          ACTOR: ${{ github.actor }}
          TRIGGER: ${{ github.triggering_actor }}
          DISPATCHERS: ${{ vars.DOOP_LIFT_DISPATCHERS }}
        run: node scripts/deploy-lift.mjs admit
      # C-5: every C00 job removes the compat sandboxes first. A failed sweep fails the run before the lift.
      - name: Sweep the compat sandboxes
        run: bash deploy/cd/c00.sh sweep
      # One step, all under the C00 flock: quiescence, then digest, revision label and health, then the decision and
      # the marker read, decided, read again, and written. Anything missing refuses and leaves the marker as it was.
      - name: Lift on C00
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          LIFTER: ${{ github.triggering_actor }}
          DECISION_ID: ${{ inputs.decision_id }}
          APPROVER_ID: ${{ vars.DOOP_LIFT_APPROVER_ID }}
          MULTICA_SERVER_URL: ${{ secrets.DOOP_LIFT_MULTICA_SERVER_URL }}
          MULTICA_WORKSPACE_ID: ${{ secrets.DOOP_LIFT_MULTICA_WORKSPACE_ID }}
          DECISION_READ_TOKEN: ${{ secrets.DOOP_LIFT_DECISION_READ_TOKEN }}
          # What the app answers on C00 itself; set the variable when the published port is not 4400.
          HEALTHZ_URL: ${{ vars.C00_DOOP_HEALTHZ_URL || 'http://127.0.0.1:4400/healthz' }}
        run: bash deploy/cd/c00.sh lift
      - name: Upload the lift evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: lift-evidence
          path: lift-evidence.json
          if-no-files-found: warn
