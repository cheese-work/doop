# ci-policy: class=gate
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
  # Queue entry: `cla-assistant` is a required check and must report on the queue commit. The signing step's
  # `if:` is false for this event, so the step is skipped and the job passes: the PR already passed the
  # CLA on its own head. Do not add a head checkout or a secret to a merge_group run.
  merge_group:

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/kgoedecke/doop/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: kgoedecke,bot*,*[bot],Claude*
          # Default is true, which locks every merged PR. release-please then cannot comment on or
          # relabel its own merged release PR, so every later run aborts with "untagged, merged
          # release PRs outstanding" and no new release PR is ever opened.
          lock-pullrequest-aftermerge: false
