# Throwaway CHE-5553 probe. Never merge. Prints names, lengths and HTTP status only.
name: che-5553-lift-probe
on:
  pull_request:
    paths: ['.github/workflows/che-5553-lift-probe.yml']
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    environment: doop-lift
    env:
      TOKEN: ${{ secrets.DOOP_LIFT_DECISION_READ_TOKEN }}
      SERVER: ${{ secrets.DOOP_LIFT_MULTICA_SERVER_URL }}
      WS: ${{ secrets.DOOP_LIFT_MULTICA_WORKSPACE_ID }}
    steps:
      - name: secrets present and decision read
        run: |
          set -u
          for n in TOKEN SERVER WS; do v="${!n}"; echo "$n length=${#v}"; [ -n "$v" ] || { echo "MISSING $n"; exit 1; }; done
          for id in 46fb083a-23ba-4369-9171-42396cebd3a2 00000000-0000-4000-8000-000000000000; do
            code="$(curl -sS -o body.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" -H "X-Workspace-ID: $WS" "$SERVER/api/decisions/$id/state")"
            echo "GET state $id -> HTTP $code"
            [ "$code" = 200 ] && python3 -c 'import json;d=json.load(open("body.json"));print("state=",d.get("state"),"action_type=",d.get("action_type"))'
          done
