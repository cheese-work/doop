# ci-policy: class=deploy
# Build the server image on a GitHub-hosted runner (CHE-5119; never on C00/X99, CHE-2353) and push it to GHCR
# tagged with the source SHA. Smallest build step only: no deploy, no tests (CHE-2752).
name: image-build

on:
  push:
    branches: [ci/che-5119-image-build, ci/che-2734-image-revision]
  workflow_dispatch:
    inputs:
      sha:
        description: Source commit to build
        required: true

permissions:
  contents: read
  packages: write

env:
  # push has no input: build the CHE-2734 sync commit (doop 0.12.0 on cheese/main)
  SHA: ${{ inputs.sha || '76a5718ab5a5b6ad7d14842b4ab2fae63635df3c' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ env.SHA }}
          # The C00 readback (deploy/cd/c00.sh) compares the revision label with the deployed SHA (CHE-2734).
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
      - run: |
          {
            echo "image: ghcr.io/${{ github.repository }}:${{ env.SHA }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo "source: ${{ env.SHA }}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
