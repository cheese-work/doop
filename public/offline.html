<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fdfdfd" />
    <title>Offline · Doop</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font:
          16px/1.5 system-ui,
          sans-serif;
        color: #111;
        background: #fdfdfd;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #eee;
          background: #111;
        }
      }
      main {
        padding: 24px;
        max-width: 28rem;
      }
      button {
        font: inherit;
        padding: 8px 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Doop needs a connection to load your canvases. Check your network, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
